name: full-verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: launchpad
          POSTGRES_USER: launchpad
          POSTGRES_PASSWORD: launchpad
        ports:
          - 5441:5432
        options: >-
          --health-cmd "pg_isready -U launchpad -d launchpad"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      LAUNCHPAD_DATABASE_URL: postgresql+psycopg://launchpad:launchpad@127.0.0.1:5441/launchpad
      LAUNCHPAD_TEST_POSTGRES_URL: postgresql+psycopg://launchpad:launchpad@127.0.0.1:5441/launchpad
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.10.12"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src tests scripts/seed_demo.py
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest --cov=acquisition_launchpad --cov-fail-under=94
      - run: uv run --with pip-audit pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  full-stack-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: make demo-up
      - run: >-
          LAUNCHPAD_E2E_SKIP_WEBSERVER=1
          LAUNCHPAD_E2E_WEB_BASE_URL=http://127.0.0.1:3011
          LAUNCHPAD_E2E_API_BASE_URL=http://127.0.0.1:8011
          npm --prefix frontend run test:e2e
      - if: always()
        run: docker compose logs --no-color api frontend seed migrate
      - if: always()
        run: make demo-down
